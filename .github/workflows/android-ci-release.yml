name: LouderMe Android CI & Direct Release

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'development/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: louderme-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate current HEAD
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          name = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          code = re.search(r'versionCode\s*=\s*(\d+)', source)
          if not name or not code:
              raise SystemExit("versionName/versionCode not found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={name.group(1)}\n")
              out.write(f"version_code={code.group(1)}\n")
          print("Version:", name.group(1), "code:", code.group(1))
          PY

      - name: Validate Michel's Lab identity and updater split
        shell: bash
        run: |
          grep -q 'namespace = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'applicationId = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'create("play")' app/build.gradle.kts
          grep -q 'create("sideload")' app/build.gradle.kts
          grep -q 'UPDATE_CHANNEL' app/build.gradle.kts

      - name: Run tests and build distribution flavors
        run: |
          gradle             :app:testPlayDebugUnitTest             :app:testSideloadDebugUnitTest             :app:assemblePlayDebug             :app:assembleSideloadDebug             :app:assembleSideloadRelease             --stacktrace

      - name: Verify package IDs and flavor permissions
        shell: bash
        run: |
          mkdir -p artifacts
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"

          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          SIDELOAD_APK="app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"

          "$AAPT" dump badging "$PLAY_APK" | tee artifacts/play-apk-badging.txt
          "$AAPT" dump badging "$SIDELOAD_APK" | tee artifacts/sideload-apk-badging.txt

          grep -q "package: name='com.michelslab.louderme'" artifacts/play-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme'" artifacts/sideload-apk-badging.txt

          "$AAPT" dump permissions "$PLAY_APK" | tee artifacts/play-permissions.txt
          "$AAPT" dump permissions "$SIDELOAD_APK" | tee artifacts/sideload-permissions.txt

          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/play-permissions.txt; then
            echo "Play flavor must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/sideload-permissions.txt

      - name: Prepare validation artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cp             app/build/outputs/apk/play/debug/app-play-debug.apk             "artifacts/LouderMe-v$VERSION-play-debug.apk"

          cp             app/build/outputs/apk/sideload/debug/app-sideload-debug.apk             "artifacts/LouderMe-v$VERSION-sideload-debug.apk"

          cp             app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk             "artifacts/LouderMe-v$VERSION-sideload-release-unsigned.apk"

          sha256sum artifacts/*.apk > artifacts/validation.sha256

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-v${{ steps.version.outputs.version }}
          path: artifacts/

  bootstrap_sideload_key:
    name: Bootstrap first stable sideload key
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.4'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Generate stable sideload key and sign baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing signed
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          ALIAS="louderme_sideload"

          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore signing/louderme-sideload.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Michel's Lab, OU=Software, O=Michel's Lab, L=Saltillo, ST=Coahuila, C=MX"

          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          VERSION="${{ needs.validate.outputs.version }}"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="signed/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="signed/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/louderme-sideload.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$FINAL" | tee signed/signature-verification.txt

          sha256sum "$FINAL" | tee "$FINAL.sha256"

          BASE64_KEYSTORE="$(base64 -w 0 signing/louderme-sideload.jks)"

          {
            echo "LOUDERME_SIDELOAD_KEYSTORE_BASE64=$BASE64_KEYSTORE"
            echo "LOUDERME_SIDELOAD_STORE_PASSWORD=$STORE_PASS"
            echo "LOUDERME_SIDELOAD_KEY_ALIAS=$ALIAS"
            echo "LOUDERME_SIDELOAD_KEY_PASSWORD=$KEY_PASS"
          } > signing/github-actions-secrets.txt

          cat > signing/README-PRIVATE.txt <<'TXT'
          LouderMe stable sideload signing material.

          KEEP THIS PRIVATE.

          Add the four values in github-actions-secrets.txt as repository
          Actions secrets in realmichelduarte/LouderMe.

          This is a one-time bootstrap. Future direct APKs must use exactly
          this key or Android will reject in-place updates.
          TXT

      - name: Upload stable signed v0.1.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload-bootstrap
          retention-days: 90
          path: |
            signed/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk
            signed/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk.sha256
            signed/signature-verification.txt

      - name: Upload private signing handoff
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-sideload-signing-material-PRIVATE
          retention-days: 7
          path: |
            signing/louderme-sideload.jks
            signing/github-actions-secrets.txt
            signing/README-PRIVATE.txt

  sign_sideload:
    name: Sign stable Michel's Lab Direct APK
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      signed_ready: ${{ steps.sign.outputs.signed_ready || 'false' }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Check stable sideload signing configuration
        id: key_config
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable sideload signing secrets are not configured yet. Validation passed; signing/publication are intentionally skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore existing stable sideload keystore
        if: steps.key_config.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/louderme-sideload.jks
          test -s signing/louderme-sideload.jks

      - name: Sign and verify sideload APK with existing key
        if: steps.key_config.outputs.ready == 'true'
        id: sign
        env:
          STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          VERSION="${{ needs.validate.outputs.version }}"
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="validated/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="validated/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks signing/louderme-sideload.jks             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$STORE_PASS"             --key-pass "pass:$KEY_PASS"             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify             --verbose             --print-certs             "$FINAL"             | tee validated/sideload-signature.txt

          sha256sum "$FINAL" | tee "$FINAL.sha256"

          echo "signed_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload stable signed sideload APK
        if: steps.key_config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: |
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk.sha256
            validated/sideload-signature.txt

  publish_private_release:
    name: Publish validated private release
    needs:
      - validate
      - sign_sideload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sign_sideload.outputs.signed_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: dist

      - name: Publish private source-repo release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v$VERSION"
          APK="dist/LouderMe-v$VERSION-sideload.apk"
          CHECKSUM="dist/LouderMe-v$VERSION-sideload.apk.sha256"
          NOTES="docs/RELEASE_NOTES_v$VERSION.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Validation and signing still completed."
            exit 0
          fi

          test -f "$NOTES"

          gh release create "$TAG"             "$APK"             "$CHECKSUM"             --target "$GITHUB_SHA"             --title "LouderMe $TAG"             --notes-file "$NOTES"

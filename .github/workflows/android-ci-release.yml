name: LouderMe Android CI & Direct Release

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'development/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: louderme-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate current HEAD
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          name = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          code = re.search(r'versionCode\s*=\s*(\d+)', source)
          if not name or not code:
              raise SystemExit("versionName/versionCode not found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={name.group(1)}\n")
              out.write(f"version_code={code.group(1)}\n")
          print("Version:", name.group(1), "code:", code.group(1))
          PY

      - name: Validate Michel's Lab identity and updater split
        shell: bash
        run: |
          grep -q 'namespace = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'applicationId = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'create("play")' app/build.gradle.kts
          grep -q 'create("sideload")' app/build.gradle.kts
          grep -q 'UPDATE_CHANNEL' app/build.gradle.kts

          test "$(git hash-object app/src/main/res/drawable/michel_duarte_avatar.jpg)" = "18fe1a68722850c3d8f918dc0799f46ffeb6dbaf"
          test "$(git hash-object app/src/main/assets/branding/michels-lab/official-mark.png)" = "f205c15c3b6bd7fe676ced83fd1ea2ae24c25586"
          test "$(git hash-object app/src/main/assets/branding/michels-lab/official-lockup.png)" = "7819ef5c7d1a5c338c67c9bbd517e5448724a5cf"
          grep -q 'SocialNetwork.FACEBOOK' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'branding/michels-lab/official-lockup.png' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'SOUND THAT LIFTS YOU' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'CanonicalWaveform' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'EqWavePreview' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'BackHandler(enabled = showAbout)' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt

      - name: Run tests and build distribution flavors
        run: |
          gradle \
            :app:testPlayDebugUnitTest \
            :app:testSideloadDebugUnitTest \
            :app:assemblePlayDebug \
            :app:assembleSideloadDebug \
            :app:assembleSideloadRelease \
            --stacktrace

      - name: Verify package IDs and flavor permissions
        shell: bash
        run: |
          mkdir -p artifacts
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"

          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          SIDELOAD_APK="app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"

          "$AAPT" dump badging "$PLAY_APK" | tee artifacts/play-apk-badging.txt
          "$AAPT" dump badging "$SIDELOAD_APK" | tee artifacts/sideload-apk-badging.txt

          grep -q "package: name='com.michelslab.louderme'" artifacts/play-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme'" artifacts/sideload-apk-badging.txt

          "$AAPT" dump permissions "$PLAY_APK" | tee artifacts/play-permissions.txt
          "$AAPT" dump permissions "$SIDELOAD_APK" | tee artifacts/sideload-permissions.txt

          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/play-permissions.txt; then
            echo "Play flavor must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/sideload-permissions.txt

      - name: Prepare validation artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cp app/build/outputs/apk/play/debug/app-play-debug.apk \
            "artifacts/LouderMe-v$VERSION-play-debug.apk"

          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk \
            "artifacts/LouderMe-v$VERSION-sideload-debug.apk"

          cp app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk \
            "artifacts/LouderMe-v$VERSION-sideload-release-unsigned.apk"

          sha256sum artifacts/*.apk > artifacts/validation.sha256

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-v${{ steps.version.outputs.version }}
          path: artifacts/

  sign_sideload:
    name: Sign stable Michel's Lab Direct APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      signed_ready: ${{ steps.sign.outputs.signed_ready || 'false' }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Prepare stable sideload signing identity
        id: key_config
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          READY=false

          if [ -n "$SECRET_KEYSTORE_BASE64" ] && \
             [ -n "$SECRET_STORE_PASS" ] && \
             [ -n "$SECRET_KEY_ALIAS" ] && \
             [ -n "$SECRET_KEY_PASS" ]; then
            printf '%s' "$SECRET_KEYSTORE_BASE64" | base64 --decode \
              > signing/louderme-sideload.jks

            if keytool -list \
              -keystore signing/louderme-sideload.jks \
              -storepass "$SECRET_STORE_PASS" \
              -alias "$SECRET_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_PASS="$SECRET_STORE_PASS"
              KEY_ALIAS="$SECRET_KEY_ALIAS"
              KEY_PASS="$SECRET_KEY_PASS"
              READY=true
              echo "Using validated GitHub Secrets signing identity."
            else
              echo "::warning::Configured signing Secrets are invalid; falling back to the private signing vault."
              rm -f signing/louderme-sideload.jks
            fi
          fi

          if [ "$READY" != "true" ]; then
            # ONE-TIME RECOVERY: original signer from an existing successful v0.1.9 run.
            # No signing credentials are printed, committed or uploaded as artifacts.
            if [ "${{ needs.validate.outputs.version }}" != "0.1.10" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Stable signing Secrets invalid. One-time signer recovery only supports main v0.1.10."
              exit 1
            fi
            echo "::warning::Recovering the existing v0.1.9 signing identity for one-time v0.1.10 continuity. Configure GitHub Secrets for future releases."
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11459101203/zip" \
              --output signing/legacy-vault.zip
            mkdir -p signing/legacy-vault
            unzip -q signing/legacy-vault.zip -d signing/legacy-vault
            KEYSTORE_FILE="$(find signing/legacy-vault -type f -name 'louderme-sideload.jks' -print -quit)"
            HANDOFF_FILE="$(find signing/legacy-vault -type f -name 'github-actions-secrets.txt' -print -quit)"
            test -n "$KEYSTORE_FILE"
            test -n "$HANDOFF_FILE"
            cp "$KEYSTORE_FILE" signing/louderme-sideload.jks
            STORE_PASS="$(grep -m1 '^LOUDERME_SIDELOAD_STORE_PASSWORD=' "$HANDOFF_FILE" | cut -d= -f2-)"
            KEY_ALIAS="$(grep -m1 '^LOUDERME_SIDELOAD_KEY_ALIAS=' "$HANDOFF_FILE" | cut -d= -f2-)"
            KEY_PASS="$(grep -m1 '^LOUDERME_SIDELOAD_KEY_PASSWORD=' "$HANDOFF_FILE" | cut -d= -f2-)"
            test -n "$STORE_PASS"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASS"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$KEY_ALIAS"
            echo "::add-mask::$KEY_PASS"
            keytool -list -keystore signing/louderme-sideload.jks \
              -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
            rm -rf signing/legacy-vault signing/legacy-vault.zip
            READY=true
          fi

          # Verify certificate continuity with the published v0.1.9 APK, regardless
          # of which credential source supplied the signing identity.
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/michels-lab/LouderMe/releases/download/v0.1.9/LouderMe-v0.1.9-sideload.apk" \
            --output signing/stable-v0.1.9.apk
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          REFERENCE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs signing/stable-v0.1.9.apk | \
            grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')"
          SELECTED_CERT="$(keytool -exportcert \
            -keystore signing/louderme-sideload.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
            | openssl dgst -sha256 | awk '{print $NF}')"
          test -n "$REFERENCE_CERT"
          test -n "$SELECTED_CERT"
          if [ "$REFERENCE_CERT" != "$SELECTED_CERT" ]; then
            echo "::error::Android signer fingerprint differs from published v0.1.9. Refusing update."
            exit 1
          fi
          echo "Stable signing certificate matches v0.1.9."

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"

          {
            echo "STORE_PASS=$STORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Sign and verify sideload APK
        if: steps.key_config.outputs.ready == 'true'
        id: sign
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="validated/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="validated/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/louderme-sideload.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$FINAL" | tee validated/sideload-signature.txt

          sha256sum "$FINAL" | tee "$FINAL.sha256"

          echo "signed_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload stable signed sideload APK
        if: steps.key_config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: |
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk.sha256
            validated/sideload-signature.txt

  publish_private_release:
    name: Publish validated private release
    needs:
      - validate
      - sign_sideload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sign_sideload.outputs.signed_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: dist

      - name: Publish private source-repo release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v$VERSION"
          APK="dist/LouderMe-v$VERSION-sideload.apk"
          CHECKSUM="dist/LouderMe-v$VERSION-sideload.apk.sha256"
          NOTES="docs/RELEASE_NOTES_v$VERSION.md"

          test -f "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" \
              "$APK" \
              "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "LouderMe $TAG" \
              --notes-file "$NOTES"
          fi

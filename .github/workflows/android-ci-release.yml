name: LouderMe Android CI & Direct Release

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'development/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: louderme-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate current HEAD
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          name = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          code = re.search(r'versionCode\s*=\s*(\d+)', source)
          if not name or not code:
              raise SystemExit("versionName/versionCode not found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={name.group(1)}\n")
              out.write(f"version_code={code.group(1)}\n")
          print("Version:", name.group(1), "code:", code.group(1))
          PY

      - name: Validate Michel's Lab identity and updater split
        shell: bash
        run: |
          grep -q 'namespace = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'applicationId = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'create("play")' app/build.gradle.kts
          grep -q 'create("sideload")' app/build.gradle.kts
          grep -q 'UPDATE_CHANNEL' app/build.gradle.kts

          test "$(git hash-object app/src/main/res/drawable/michel_duarte_avatar.jpg)" = "18fe1a68722850c3d8f918dc0799f46ffeb6dbaf"
          test "$(git hash-object app/src/main/assets/branding/michels-lab/official-mark.png)" = "f205c15c3b6bd7fe676ced83fd1ea2ae24c25586"
          test "$(git hash-object app/src/main/assets/branding/michels-lab/official-lockup.png)" = "7819ef5c7d1a5c338c67c9bbd517e5448724a5cf"
          grep -q 'SocialNetwork.FACEBOOK' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'branding/michels-lab/official-lockup.png' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'SOUND THAT LIFTS YOU' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'CanonicalWaveform' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'EqWavePreview' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'BackHandler(enabled = showAbout && owner?.inspect != true)' app/src/main/java/com/michelslab/louderme/ui/LouderMeApp.kt
          grep -q 'create("developer")' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".developer"' app/build.gradle.kts

      - name: Validate manual Developer signing YAML and privacy boundaries without Secrets
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          path = Path(".github/workflows/developer-android-signed-owner-qa.yml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert set(doc["jobs"]) == {"sign", "verify_installed_upgrade", "verified_candidate"}
          assert "github.event.repository.private == true" in doc["jobs"]["sign"]["if"]
          assert doc["jobs"]["verified_candidate"]["needs"] == ["sign", "verify_installed_upgrade"]
          print("Dedicated Developer signing workflow parses and remains manual + private-only.")
          PY
          python3 -m unittest discover -s tools/tests -p 'test_android_developer_signed_contract.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_android_developer_harness.py' -v
          python3 -m py_compile tools/capture_android_developer.py

      - name: Run tests and build distribution flavors
        run: |
          gradle \
            :app:testPlayDebugUnitTest \
            :app:testSideloadDebugUnitTest \
            :app:testDeveloperDebugUnitTest \
            :app:assembleDeveloperDebug \
            :app:assembleDeveloperRelease \
            :app:assemblePlayDebug \
            :app:assembleSideloadDebug \
            :app:assembleSideloadRelease \
            --stacktrace

      - name: Verify package IDs and flavor permissions
        shell: bash
        run: |
          mkdir -p artifacts
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"

          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          SIDELOAD_APK="app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"
          DEV_APK="app/build/outputs/apk/developer/debug/app-developer-debug.apk"
          DEV_RELEASE="app/build/outputs/apk/developer/release/app-developer-release-unsigned.apk"

          "$AAPT" dump badging "$PLAY_APK" | tee artifacts/play-apk-badging.txt
          "$AAPT" dump badging "$SIDELOAD_APK" | tee artifacts/sideload-apk-badging.txt
          "$AAPT" dump badging "$DEV_APK" | tee artifacts/developer-apk-badging.txt
          "$AAPT" dump badging "$DEV_RELEASE" | tee artifacts/developer-release-apk-badging.txt

          grep -q "package: name='com.michelslab.louderme'" artifacts/play-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme'" artifacts/sideload-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme.developer'" artifacts/developer-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme.developer'" artifacts/developer-release-apk-badging.txt

          "$AAPT" dump permissions "$PLAY_APK" | tee artifacts/play-permissions.txt
          "$AAPT" dump permissions "$SIDELOAD_APK" | tee artifacts/sideload-permissions.txt
          "$AAPT" dump permissions "$DEV_APK" | tee artifacts/developer-permissions.txt

          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/play-permissions.txt; then
            echo "Play flavor must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/sideload-permissions.txt
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/developer-permissions.txt; then
            echo 'Developer Edition must never have direct installer permission.'
            exit 1
          fi

      - name: Prepare validation artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cp app/build/outputs/apk/play/debug/app-play-debug.apk \
            "artifacts/LouderMe-v$VERSION-play-debug.apk"

          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk \
            "artifacts/LouderMe-v$VERSION-sideload-debug.apk"

          cp app/build/outputs/apk/developer/debug/app-developer-debug.apk \
            "artifacts/LouderMe-v$VERSION-developer-debug.apk"

          cp app/build/outputs/apk/developer/release/app-developer-release-unsigned.apk \
            "artifacts/LouderMe-v$VERSION-developer-release-unsigned.apk"

          cp app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk \
            "artifacts/LouderMe-v$VERSION-sideload-release-unsigned.apk"

          sha256sum artifacts/*.apk > artifacts/validation.sha256

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-v${{ steps.version.outputs.version }}
          path: artifacts/

  visual_qa:
    name: Install Android APK and validate Home/About screenshot evidence
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check real Android UI capture helper
        run: python3 -m py_compile tools/capture_android_visual.py tools/visual_release_gate.py
      - name: Install exact image-integrity validator dependency
        run: python3 -m pip install Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: visual-input
      - name: Enable hardware-assisted Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install actual Android Debug candidate; screenshot real Home/About
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash tools/run_android_visual_ci.sh
      - name: Enforce Michel's Lab exact-candidate Android rendered UI gate
        run: |
          python3 tools/visual_release_gate.py \
            --manifest artifacts/visual/android/manifest.json \
            --source-sha "$GITHUB_SHA" --platforms android --surfaces home,about
      - name: Retain immutable screenshot evidence for post-release human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-Rendered-UI-${{ github.sha }}
          path: artifacts/visual/android/
          if-no-files-found: warn
          retention-days: 30

  developer_qa:
    name: Install Developer Edition and test notes/audit/report persistence
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check developer and baseline installed UI harness
        run: python3 -m py_compile tools/capture_android_developer.py tools/capture_android_visual.py
      - name: Verify developer recovery only accepts actual app UI
        run: python3 -m unittest discover -s tools/tests -p 'test_android_developer_harness.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: developer-input
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test actual independently installed Developer Edition and owner-note workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: python3 tools/capture_android_developer.py --apk "developer-input/LouderMe-v${{ needs.validate.outputs.version }}-developer-debug.apk" --public-apk "developer-input/LouderMe-v${{ needs.validate.outputs.version }}-sideload-debug.apk" --source-sha "$GITHUB_SHA" --out artifacts/developer-qa
      - name: Retain exact installed developer audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Developer-Installed-${{ github.sha }}
          path: artifacts/developer-qa/
          if-no-files-found: warn
          retention-days: 30

  release_guard:
    name: Check stable Android release uniqueness
    # No new stable Android build may be signed while the installed Developer
    # Edition cannot actually open, annotate, persist and review its audit.
    needs: [validate, visual_qa, developer_qa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Prevent same-version APK overwrites
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable Android v$VERSION already exists; no re-sign or clobber."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  sign_sideload:
    name: Sign stable Michel's Lab Direct APK
    needs: [validate, release_guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_guard.outputs.publish == 'true'
    runs-on: ubuntu-latest

    outputs:
      signed_ready: ${{ steps.sign.outputs.signed_ready || 'false' }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Prepare permanent LouderMe v0.1.11+ sideload signing identity
        id: key_config
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          # Owner-approved one-time signing-identity migration for v0.1.11.
          # The certificate below is PUBLIC metadata; the private key and
          # credentials must only be supplied by protected GitHub Secrets.
          EXPECTED_CERT_SHA256="4a5bb9d9456a656821c3c1105854bda17e24273fd0d09e9495edd5b01e783aa3"

          if [ -z "$SECRET_KEYSTORE_BASE64" ] || [ -z "$SECRET_STORE_PASS" ] || \
             [ -z "$SECRET_KEY_ALIAS" ] || [ -z "$SECRET_KEY_PASS" ]; then
            echo "::error::All four LOUDERME_SIDELOAD_* repository Secrets must be configured."
            exit 1
          fi
          echo "::add-mask::$SECRET_STORE_PASS"
          echo "::add-mask::$SECRET_KEY_ALIAS"
          echo "::add-mask::$SECRET_KEY_PASS"

          if ! printf '%s' "$SECRET_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > signing/louderme-sideload.jks; then
            echo "::error::Invalid Base64 keystore Secret; use the full keystore.base64.txt content."
            exit 1
          fi
          if ! keytool -list -keystore signing/louderme-sideload.jks \
            -storepass "$SECRET_STORE_PASS" -alias "$SECRET_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened with the configured password and alias."
            exit 1
          fi
          SELECTED_CERT="$(keytool -exportcert \
            -keystore signing/louderme-sideload.jks -storepass "$SECRET_STORE_PASS" \
            -alias "$SECRET_KEY_ALIAS" | openssl dgst -sha256 | awk '{print $NF}')"
          if [ "$SELECTED_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificate does not match the owner-approved v0.1.11+ signer."
            exit 1
          fi
          echo "Permanent LouderMe v0.1.11+ signing certificate verified."

          {
            printf 'STORE_PASS=%s\n' "$SECRET_STORE_PASS"
            printf 'KEY_ALIAS=%s\n' "$SECRET_KEY_ALIAS"
            printf 'KEY_PASS=%s\n' "$SECRET_KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Sign and verify sideload APK
        if: steps.key_config.outputs.ready == 'true'
        id: sign
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="validated/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="validated/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/louderme-sideload.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$FINAL" | tee validated/sideload-signature.txt

          # Check the final signed APK, not just the input keystore.
          APK_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$FINAL" |
            grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')"
          EXPECTED_CERT_SHA256="4a5bb9d9456a656821c3c1105854bda17e24273fd0d09e9495edd5b01e783aa3"
          if [ "$APK_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signed APK certificate does not match permanent LouderMe identity."
            exit 1
          fi
          echo "Signed APK matches permanent LouderMe certificate."

          sha256sum "$FINAL" | tee "$FINAL.sha256"

          echo "signed_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload stable signed sideload APK
        if: steps.key_config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: |
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk
            validated/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk.sha256
            validated/sideload-signature.txt

      - name: Erase ephemeral keystore after signing
        if: always()
        shell: bash
        run: |
          rm -f signing/louderme-sideload.jks
  signed_visual_qa:
    name: Install FINAL signed APK and validate Home/About evidence
    needs: [validate, release_guard, sign_sideload]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_guard.outputs.publish == 'true' && needs.sign_sideload.outputs.signed_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate screenshot tool syntax and install image verifier
        run: |
          python3 -m py_compile tools/capture_android_visual.py tools/visual_release_gate.py
          python3 -m pip install Pillow==11.3.0
      - name: Fetch exact FINAL release-signed APK and its checksum
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: signed-input
      - name: Verify the signed candidate bytes before emulated installation
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APK="signed-input/LouderMe-v$VERSION-sideload.apk"
          SUM="$APK.sha256"
          test -s "$APK" && test -s "$SUM"
          EXPECTED="$(awk 'NR==1 {print $1}' "$SUM")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "Final signed release APK hash matches verified signing artifact."
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install signed RELEASE APK, capture real Home/About on two viewports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash tools/run_android_signed_visual_ci.sh
      - name: Fail closed on real signed APK rendered-UI evidence mismatch
        run: |
          python3 tools/visual_release_gate.py \
            --manifest artifacts/visual/android-signed/manifest.json \
            --source-sha "$GITHUB_SHA" --platforms android --surfaces home,about
          python3 tools/verify_signed_android_evidence.py \
            --manifest artifacts/visual/android-signed/manifest.json \
            --signed-apk "signed-input/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk"
      - name: Retain signed-APK proof and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-Signed-Rendered-UI-${{ github.sha }}
          path: artifacts/visual/android-signed/
          if-no-files-found: warn
          retention-days: 30

  publish_private_release:
    name: Publish validated private release
    needs:
      - validate
      - release_guard
      - sign_sideload
      - signed_visual_qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_guard.outputs.publish == 'true' && needs.sign_sideload.outputs.signed_ready == 'true' && needs.signed_visual_qa.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: dist

      - name: Publish private source-repo release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v$VERSION"
          APK="dist/LouderMe-v$VERSION-sideload.apk"
          CHECKSUM="dist/LouderMe-v$VERSION-sideload.apk.sha256"
          NOTES="docs/RELEASE_NOTES_v$VERSION.md"

          test -f "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Stable version already exists. Refusing to replace published APK."
            exit 1
          fi
          gh release create "$TAG" \
            "$APK" \
            "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --title "LouderMe $TAG" \
            --notes-file "$NOTES"

name: LouderMe Android CI & Release

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'development/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Build and validate current HEAD
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")

          name = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          code = re.search(r'versionCode\s*=\s*(\d+)', source)

          if not name or not code:
              raise SystemExit("versionName/versionCode not found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={name.group(1)}\n")
              out.write(f"version_code={code.group(1)}\n")

          print("Version:", name.group(1), "code", code.group(1))
          PY

      - name: Validate Michel's Lab package identity
        shell: bash
        run: |
          grep -q 'namespace = "com.michelslab.louderme"' app/build.gradle.kts
          grep -q 'applicationId = "com.michelslab.louderme"' app/build.gradle.kts

      - name: Run tests and build both distribution flavors
        run: |
          gradle             :app:testPlayDebugUnitTest             :app:testSideloadDebugUnitTest             :app:assemblePlayDebug             :app:assembleSideloadDebug             :app:assembleSideloadRelease             --stacktrace

      - name: Verify packaged application IDs and permissions
        shell: bash
        run: |
          mkdir -p artifacts
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"

          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          SIDELOAD_APK="app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"

          "$AAPT" dump badging "$PLAY_APK" | tee artifacts/play-apk-badging.txt
          "$AAPT" dump badging "$SIDELOAD_APK" | tee artifacts/sideload-apk-badging.txt

          grep -q "package: name='com.michelslab.louderme'" artifacts/play-apk-badging.txt
          grep -q "package: name='com.michelslab.louderme'" artifacts/sideload-apk-badging.txt

          "$AAPT" dump permissions "$PLAY_APK" | tee artifacts/play-permissions.txt
          "$AAPT" dump permissions "$SIDELOAD_APK" | tee artifacts/sideload-permissions.txt

          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/play-permissions.txt; then
            echo "Play flavor must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' artifacts/sideload-permissions.txt

      - name: Prepare validation artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cp             app/build/outputs/apk/play/debug/app-play-debug.apk             "artifacts/LouderMe-v$VERSION-play-debug.apk"

          cp             app/build/outputs/apk/sideload/debug/app-sideload-debug.apk             "artifacts/LouderMe-v$VERSION-sideload-debug.apk"

          cp             app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk             "artifacts/LouderMe-v$VERSION-sideload-release-unsigned.apk"

          sha256sum artifacts/*.apk > artifacts/debug-and-unsigned.sha256

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Android-v${{ steps.version.outputs.version }}
          path: artifacts/

  bootstrap_sideload_signing:
    name: Bootstrap stable sideload signing key
    needs: validate
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/v0.1.4' &&
      contains(github.event.head_commit.message, '[bootstrap-signing]')
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Generate one-time stable sideload signing material
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing signed
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          ALIAS="louderme_sideload"

          keytool -genkeypair             -keystore signing/louderme-sideload.jks             -storepass "$STORE_PASS"             -keypass "$KEY_PASS"             -alias "$ALIAS"             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Michel's Lab, OU=Software, O=Michel's Lab, L=Saltillo, ST=Coahuila, C=MX"

          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          VERSION="${{ needs.validate.outputs.version }}"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="signed/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="signed/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks signing/louderme-sideload.jks             --ks-key-alias "$ALIAS"             --ks-pass "pass:$STORE_PASS"             --key-pass "pass:$KEY_PASS"             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify             --verbose             --print-certs             "$FINAL"             > signed/signature-verification.txt

          sha256sum "$FINAL" > "$FINAL.sha256"
          base64 -w 0 signing/louderme-sideload.jks > signing/keystore.base64.txt

          cat > signing/github-secret-names.txt <<TXT
          LOUDERME_SIDELOAD_KEYSTORE_BASE64=<contents of keystore.base64.txt>
          LOUDERME_SIDELOAD_STORE_PASSWORD=$STORE_PASS
          LOUDERME_SIDELOAD_KEY_ALIAS=$ALIAS
          LOUDERME_SIDELOAD_KEY_PASSWORD=$KEY_PASS
          TXT

          cat > signing/README-PRIVATE.txt <<'TXT'
          LouderMe stable sideload signing handoff

          KEEP THIS PRIVATE.

          Download this artifact once, back up louderme-sideload.jks securely,
          and add the four values in github-secret-names.txt as repository
          Actions secrets in realmichelduarte/LouderMe.

          Losing the key breaks future in-place sideload updates.
          Exposing it allows another party to impersonate LouderMe updates.

          This bootstrap artifact is retained for only 7 days.
          TXT

      - name: Upload signed bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-v${{ needs.validate.outputs.version }}-stable-sideload
          path: |
            signed/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk
            signed/LouderMe-v${{ needs.validate.outputs.version }}-sideload.apk.sha256
            signed/signature-verification.txt

      - name: Upload private signing handoff
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-sideload-signing-material-PRIVATE
          retention-days: 7
          path: signing/

  publish:
    name: Sign and publish validated release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: LouderMe-Android-v${{ needs.validate.outputs.version }}
          path: validated

      - name: Require stable signing and public-feed secrets
        env:
          KEYSTORE_B64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
          RELEASES_TOKEN: ${{ secrets.MICHELSLAB_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing LOUDERME_SIDELOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing LOUDERME_SIDELOAD_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing LOUDERME_SIDELOAD_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing LOUDERME_SIDELOAD_KEY_PASSWORD"; exit 1; }
          test -n "$RELEASES_TOKEN" || { echo "Missing MICHELSLAB_RELEASES_TOKEN"; exit 1; }

      - name: Sign stable sideload APK
        env:
          KEYSTORE_B64: ${{ secrets.LOUDERME_SIDELOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LOUDERME_SIDELOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOUDERME_SIDELOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LOUDERME_SIDELOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signed
          echo "$KEYSTORE_B64" | base64 -d > signed/louderme-sideload.jks

          VERSION="${{ needs.validate.outputs.version }}"
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          UNSIGNED="validated/LouderMe-v$VERSION-sideload-release-unsigned.apk"
          ALIGNED="signed/LouderMe-v$VERSION-sideload-aligned.apk"
          FINAL="signed/LouderMe-v$VERSION-sideload.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks signed/louderme-sideload.jks             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$STORE_PASS"             --key-pass "pass:$KEY_PASS"             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify             --verbose             --print-certs             "$FINAL"             | tee signed/signature-verification.txt

          sha256sum "$FINAL" | tee "$FINAL.sha256"

      - name: Publish private source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v$VERSION"
          APK="signed/LouderMe-v$VERSION-sideload.apk"
          SHA="signed/LouderMe-v$VERSION-sideload.apk.sha256"
          NOTES="docs/RELEASE_NOTES_v$VERSION.md"

          test -f "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA"               --target "$GITHUB_SHA"               --title "LouderMe $TAG"               --notes-file "$NOTES"
          fi

      - name: Publish public Michel's Lab direct channel
        env:
          GH_TOKEN: ${{ secrets.MICHELSLAB_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC_REPO="realmichelduarte/michel-s-life-releases"
          VERSION="${{ needs.validate.outputs.version }}"
          VERSION_CODE="${{ needs.validate.outputs.version_code }}"
          TAG="louderme-v$VERSION"
          APK="signed/LouderMe-v$VERSION-sideload.apk"
          SHA_FILE="signed/LouderMe-v$VERSION-sideload.apk.sha256"
          SHA256="$(cut -d' ' -f1 "$SHA_FILE")"
          NOTES="docs/RELEASE_NOTES_v$VERSION.md"

          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA_FILE"               --repo "$PUBLIC_REPO"               --clobber
          else
            gh release create "$TAG" "$APK" "$SHA_FILE"               --repo "$PUBLIC_REPO"               --title "LouderMe v$VERSION"               --notes-file "$NOTES"
          fi

          APK_URL="https://github.com/$PUBLIC_REPO/releases/download/$TAG/LouderMe-v$VERSION-sideload.apk"
          NOTES_URL="https://github.com/$PUBLIC_REPO/releases/tag/$TAG"

          python3 - <<PY
          import json
          manifest = {
              "versionCode": int("$VERSION_CODE"),
              "versionName": "$VERSION",
              "apkUrl": "$APK_URL",
              "sha256": "$SHA256",
              "releaseNotes": "$NOTES_URL",
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          CONTENT="$(base64 -w 0 latest.json)"
          EXISTING_SHA="$(
            gh api "repos/$PUBLIC_REPO/contents/louderme/latest.json"               --jq '.sha' 2>/dev/null || true
          )"

          if [ -n "$EXISTING_SHA" ]; then
            gh api               --method PUT               "repos/$PUBLIC_REPO/contents/louderme/latest.json"               -f message="release: point LouderMe feed to v$VERSION"               -f content="$CONTENT"               -f sha="$EXISTING_SHA"               -f branch="main" >/dev/null
          else
            gh api               --method PUT               "repos/$PUBLIC_REPO/contents/louderme/latest.json"               -f message="release: initialize LouderMe direct update feed"               -f content="$CONTENT"               -f branch="main" >/dev/null
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f signed/louderme-sideload.jks

name: Build LouderMe Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'fix/**'
    paths:
      - 'desktop/**'
      - 'app/src/main/assets/branding/louderme/**'
      - '.github/workflows/build-louderme-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/src/main/assets/branding/louderme/**'
      - '.github/workflows/build-louderme-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve desktop version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'desktop/src/LouderMeDesktop/LouderMeDesktop.csproj'
          $v = [string]$proj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Desktop version could not be resolved.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building LouderMe Desktop v$v"

      - name: Generate official Windows and installer branding
        shell: pwsh
        run: |
          choco install imagemagick --yes --no-progress
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $exe = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'ImageMagick magick.exe not found.' }
            $magickPath = $exe.FullName
          } else { $magickPath = $magick.Source }
          pwsh -File desktop/installer/prepare-branding.ps1 -MagickPath $magickPath

      - name: Restore and build native desktop app
        shell: pwsh
        run: |
          dotnet restore desktop/src/LouderMeDesktop/LouderMeDesktop.csproj
          dotnet build desktop/src/LouderMeDesktop/LouderMeDesktop.csproj -c Release --no-restore

      - name: Validate real global boost contract
        shell: pwsh
        run: |
          $math=Get-Content 'desktop/src/LouderMeDesktop/BoostMath.cs' -Raw
          if ($math -notmatch '20d \* Math\.Log10') { throw 'Percent-to-dB gain conversion is missing.' }

          $config=Get-Content 'desktop/src/LouderMeDesktop/EqualizerApoConfigBuilder.cs' -Raw
          foreach ($required in @('Device: all','Stage: post-mix','Channel: all','Preamp:','GraphicEQ:','Include: LouderMe.txt')) {
            if ($config -notmatch [regex]::Escape($required)) { throw "APO config contract missing: $required" }
          }

          $ui=Get-Content 'desktop/src/LouderMeDesktop/MainForm.cs' -Raw
          foreach ($required in @('Global Boost','250%','Get system-wide engine','Open Configurator')) {
            if ($ui -notmatch [regex]::Escape($required)) { throw "Desktop boost UI contract missing: $required" }
          }

          $db250=20*[Math]::Log10(2.5)
          if ([Math]::Abs($db250-7.958800173) -gt 0.000001) { throw '250 percent gain conversion sanity check failed.' }

          if ((git hash-object desktop/src/LouderMeDesktop/Assets/MichelDuarte.jpg) -ne 'be4d18572bec28d53783cd4db05cb6cd289a7916') {
            throw 'Desktop Michel Duarte portrait is not the canonical asset.'
          }
          if ((git hash-object desktop/src/LouderMeDesktop/Assets/MichelsLabLockup.png) -ne '7819ef5c7d1a5c338c67c9bbd517e5448724a5cf') {
            throw "Desktop Michel's Lab lockup is not canonical."
          }

          $about=Get-Content 'desktop/src/LouderMeDesktop/AboutForm.cs' -Raw
          foreach ($required in @('ABOUT THE AUTHOR','Instagram','Facebook','LinkedIn','GitHub','Email','MichelsLabLockup','Proprietary','Equalizer APO')) {
            if ($about -notmatch [regex]::Escape($required)) { throw "Desktop About contract missing: $required" }
          }

          $program=Get-Content 'desktop/src/LouderMeDesktop/Program.cs' -Raw
          if ($program -notmatch 'SplashForm') { throw 'Desktop branded splash integration is missing.' }

          $brand=Get-Content 'desktop/src/LouderMeDesktop/BrandingControls.cs' -Raw
          if ($brand -notmatch 'WaveformMarkControl') { throw 'Desktop LouderMe waveform control is missing.' }

          $updater=Get-Content 'desktop/src/LouderMeDesktop/DesktopUpdateService.cs' -Raw
          foreach ($required in @('louderme-desktop/latest.json','installerSha256','SHA256.HashDataAsync')) {
            if ($updater -notmatch [regex]::Escape($required)) { throw "Desktop updater contract missing: $required" }
          }

      - name: Publish portable Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/artifacts/publish | Out-Null
          dotnet publish desktop/src/LouderMeDesktop/LouderMeDesktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o desktop/artifacts/publish
          $v='${{ steps.ver.outputs.version }}'
          Copy-Item desktop/artifacts/publish/LouderMe.exe "desktop/artifacts/LouderMe-Portable-v$v.exe"

      - name: Verify native desktop package
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $portable="desktop/artifacts/LouderMe-Portable-v$v.exe"
          if (-not (Test-Path $portable)) { throw 'Portable LouderMe EXE was not generated.' }
          if ((Get-Item $portable).Length -lt 1000000) { throw 'Portable executable is unexpectedly small.' }
          $iss=Get-Content desktop/installer/LouderMe.iss -Raw
          foreach ($required in @(
            'Start LouderMe with Windows',
            'WizardImageFile=',
            'WizardSmallImageFile=',
            '[Languages]',
            'spanish.DesktopShortcut'
          )) {
            if ($iss -notmatch [regex]::Escape($required)) { throw "Installer contract missing: $required" }
          }
          foreach ($asset in @(
            'desktop/src/LouderMeDesktop/Assets/LouderMeInstallerWizard.bmp',
            'desktop/src/LouderMeDesktop/Assets/LouderMeInstallerSmall.bmp'
          )) {
            if (-not (Test-Path $asset)) { throw "Branded installer asset missing: $asset" }
          }
          $startup=Get-Content desktop/src/LouderMeDesktop/StartupManager.cs -Raw
          if ($startup -notmatch 'CurrentVersion\\Run') { throw 'Native Windows startup integration is missing.' }

      - name: Create portable checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="desktop/artifacts/LouderMe-Portable-v$v.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LouderMe-Portable-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $v='${{ steps.ver.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$v" `
            "/DPublishDir=$((Resolve-Path 'desktop/artifacts/publish').Path)" `
            desktop/installer/LouderMe.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

      - name: Create installer checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="desktop/artifacts/LouderMe-Setup-v$v.exe"
          if (-not (Test-Path $exe)) { throw 'Installer EXE was not generated.' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LouderMe-Setup-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Desktop-v${{ steps.ver.outputs.version }}
          path: |
            desktop/artifacts/LouderMe-Portable-v${{ steps.ver.outputs.version }}.exe
            desktop/artifacts/LouderMe-Portable-v${{ steps.ver.outputs.version }}.exe.sha256
            desktop/artifacts/LouderMe-Setup-v${{ steps.ver.outputs.version }}.exe
            desktop/artifacts/LouderMe-Setup-v${{ steps.ver.outputs.version }}.exe.sha256
            desktop/src/LouderMeDesktop/Assets/LouderMe.ico
            desktop/src/LouderMeDesktop/Assets/LouderMeInstallerWizard.bmp
            desktop/src/LouderMeDesktop/Assets/LouderMeInstallerSmall.bmp

name: File Steward - tracked-tree audit
on:
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - 'reports/file-governance/**'
      - 'docs/audits/FILE_GOVERNANCE_LOG.md'
permissions:
  contents: write
concurrency:
  group: file-steward-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove audit safety on synthetic git fixture
        run: python3 tools/test_repository_file_auditor.py
      - name: Enumerate all tracked paths, inspect documents and write local delta log
        run: python3 tools/repository_file_auditor.py --repo .
      - name: Commit only generated audit reports in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/file-governance/FILE_GOVERNANCE.json reports/file-governance/FILE_GOVERNANCE.md reports/file-governance/SUMMARY.json docs/audits/FILE_GOVERNANCE_LOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(file-steward): refresh local audit findings [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                echo "Audit report committed and published."
                exit 0
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Audit report conflicts with another writer; no force push"
                exit 1
              fi
            done
            echo "::error::Audit report push failed after safe retries"
            exit 1
          fi

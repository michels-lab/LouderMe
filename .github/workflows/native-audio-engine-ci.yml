name: Michel's Lab native audio DSP CI
on:
  push:
    paths:
      - 'native/audio-engine/**'
      - 'app/src/main/java/com/michelslab/louderme/audio/EqualizerModels.kt'
      - 'desktop/src/LouderMeDesktop/EqualizerPresets.cs'
      - 'tools/test_louderme_eq_band_contract.py'
      - 'native/windows-bridge/**'
      - 'native/independent-tone/**'
      - 'native/virtual-driver/LabEvidenceDirectory.ps1'
      - 'native/virtual-driver/LabInputIntegrity.ps1'
      - 'native/virtual-driver/LabProcessGuard.ps1'
      - 'native/virtual-driver/test_LabProcessGuard.ps1'
      - 'native/virtual-driver/test_LabInputIntegrity.ps1'
      - 'native/virtual-driver/DefaultRenderGuard.ps1'
      - 'native/virtual-driver/test_DefaultRenderGuard.ps1'
      - 'native/virtual-driver/test_LabEvidenceDirectory.ps1'
      - 'native/virtual-driver/IndependentGainCheck.ps1'
      - 'native/virtual-driver/test_IndependentGainCheck.ps1'
      - 'native/virtual-driver/NoSourceControlCheck.ps1'
      - 'native/virtual-driver/test_NoSourceControlCheck.ps1'
      - 'native/virtual-driver/PositiveSourceCheck.ps1'
      - 'native/virtual-driver/test_PositiveSourceCheck.ps1'
      - 'native/virtual-driver/probe_independent_app_route.ps1'
      - 'native/virtual-driver/probe_independent_virtual_pcm.ps1'
      - 'native/virtual-driver/run_disposable_lab.ps1'
      - '.github/workflows/native-audio-engine-ci.yml'
  pull_request:
    paths:
      - 'native/audio-engine/**'
      - 'app/src/main/java/com/michelslab/louderme/audio/EqualizerModels.kt'
      - 'desktop/src/LouderMeDesktop/EqualizerPresets.cs'
      - 'tools/test_louderme_eq_band_contract.py'
      - 'native/windows-bridge/**'
      - 'native/independent-tone/**'
      - 'native/virtual-driver/LabEvidenceDirectory.ps1'
      - 'native/virtual-driver/LabInputIntegrity.ps1'
      - 'native/virtual-driver/LabProcessGuard.ps1'
      - 'native/virtual-driver/test_LabProcessGuard.ps1'
      - 'native/virtual-driver/test_LabInputIntegrity.ps1'
      - 'native/virtual-driver/DefaultRenderGuard.ps1'
      - 'native/virtual-driver/test_DefaultRenderGuard.ps1'
      - 'native/virtual-driver/test_LabEvidenceDirectory.ps1'
      - 'native/virtual-driver/IndependentGainCheck.ps1'
      - 'native/virtual-driver/test_IndependentGainCheck.ps1'
      - 'native/virtual-driver/NoSourceControlCheck.ps1'
      - 'native/virtual-driver/test_NoSourceControlCheck.ps1'
      - 'native/virtual-driver/PositiveSourceCheck.ps1'
      - 'native/virtual-driver/test_PositiveSourceCheck.ps1'
      - 'native/virtual-driver/probe_independent_app_route.ps1'
      - 'native/virtual-driver/probe_independent_virtual_pcm.ps1'
      - 'native/virtual-driver/run_disposable_lab.ps1'
      - '.github/workflows/native-audio-engine-ci.yml'

permissions:
  contents: read

jobs:
  dsp:
    name: Native DSP compile and PCM tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard seven-band Android Desktop and native center frequency mapping
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/test_louderme_eq_band_contract.py
      - name: Configure DSP
        run: cmake -S native/audio-engine -B native/audio-engine/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile C++17 DSP
        run: cmake --build native/audio-engine/build --config Release --parallel
      - name: Test gain, EQ, limiter and channel isolation
        run: ctest --test-dir native/audio-engine/build -C Release --output-on-failure

  windows_bridge:
    name: Windows managed/native DSP bridge interop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure native DSP DLL
        run: cmake -S native/audio-engine -B native/audio-engine/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native DSP DLL
        run: cmake --build native/audio-engine/build --config Release --target louderme_audio_c
      - name: Build experimental bridge and independent Windows source application
        run: |
          dotnet build native/windows-bridge/LouderMeAudioBridge.csproj -c Release
          dotnet build native/independent-tone/LouderMeIndependentTone.csproj -c Release
      - name: Verify independent real Windows application tone without an audio device
        shell: pwsh
        run: |
          dotnet "native/independent-tone/bin/Release/net10.0-windows/LouderMeIndependentTone.dll" --check-tone
          if ($LASTEXITCODE -ne 0) { throw 'Independent source PCM16/float32 test vectors failed.' }
      - name: Refuse silent Windows default playback reassignment during virtual driver lab
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_DefaultRenderGuard.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'A changed, unknown or raw Windows default playback endpoint passed the lab safeguard.'
          }
      - name: Verify immutable signed-driver/DSP/bridge VM inputs without real PnP or sound
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_LabInputIntegrity.ps1
          if ($LASTEXITCODE -ne 0) { throw 'LAB executable provenance/immutable-input contract rejected unsafe source.' }
      - name: Verify bounded subprocess output and owned cleanup on a synthetic Windows worker
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_LabProcessGuard.ps1
          if ($LASTEXITCODE -ne 0) { throw 'VM subprocess deadline, dual-pipe reading, or child cleanup contract FAILED.' }
      - name: Reject stale LAB evidence directories and overwrite attempts without hardware
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_LabEvidenceDirectory.ps1
          if ($LASTEXITCODE -ne 0) { throw 'LAB evidence directory ownership and immutable artifacts regression failed.' }
      - name: Reject false Windows app physical gain proof with adversarial JSON fixtures
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_IndependentGainCheck.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Independent external app gain evidence validator accepted invalid data.' }
      - name: Reject phantom Windows audio with adversarial no-source evidence
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_NoSourceControlCheck.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'Silence negative control accepted missing listener, contaminated output or fake proof.'
          }
      - name: Reject fake independent source/physical-loopback successes
        shell: pwsh
        run: |
          pwsh -NoProfile -File native/virtual-driver/test_PositiveSourceCheck.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'Independent 440Hz source completion and physical PCM report safety fixtures failed.'
          }
      - name: Validate native C ABI from managed code
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'native/audio-engine/build' -Filter 'louderme_audio_c.dll' -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw 'Native DLL missing.' }
          $outDir = 'native/windows-bridge/bin/Release/net10.0-windows'
          Copy-Item $dll.FullName -Destination "$outDir/louderme_audio_c.dll"
          dotnet "$outDir/LouderMeAudioBridge.dll" --check-native
          if ($LASTEXITCODE -ne 0) { throw 'Native managed bridge DSP test failed.' }
      - name: Validate PCM16/float32 and streaming rate adaptation without audio devices
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-formats
          if ($LASTEXITCODE -ne 0) { throw 'Windows PCM adapter numeric tests failed.' }
      - name: Reject callback PCM allocations and prove reusable sample equivalence
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-scratch
          if ($LASTEXITCODE -ne 0) { throw 'Preallocated WASAPI PCM buffer parity/GC allocation threshold failed.' }
      - name: Test PCM16 to native boost to 48k float output pipeline in memory
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-pipeline
          if ($LASTEXITCODE -ne 0) { throw 'Native PCM16 end-to-end pipeline numerical test failed.' }
      - name: Reject false-positive virtual loopback and verify exact 440 Hz tone in memory
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-loopback
          if ($LASTEXITCODE -ne 0) { throw 'Virtual loopback signal-identity verification regression failed.' }
      - name: Verify safe lab virtual tone and physical-monitor PCM test vectors
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-route-tone
          if ($LASTEXITCODE -ne 0) { throw 'Lab physical-route tone format/regression failed.' }
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-direct-dsp
          if ($LASTEXITCODE -ne 0) { throw 'Owned DSP to direct physical-mix PCM regressions failed.' }
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-direct-gain
          if ($LASTEXITCODE -ne 0) { throw 'Direct 100/150 native gain A/B evidence regressions failed.' }
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-route-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Read-only endpoint and PCM route preflight regressions failed.' }
      - name: Verify bounded clock drift and callback CPU telemetry without hardware
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-timing
          if ($LASTEXITCODE -ne 0) { throw 'Clock-drift controller or audio-workload metering numeric regression failed.' }
      - name: Verify live DSP controls are validated and applied on the audio callback only
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-controls
          if ($LASTEXITCODE -ne 0) { throw 'Live native Boost/EQ control mailbox or parser regression failed.' }
      - name: Validate bounded queue overflow/underflow recovery without hardware
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-recovery
          if ($LASTEXITCODE -ne 0) { throw 'Bounded overflow recovery or render starvation regression failed.' }
      - name: Parse isolated Windows LAB install/rollback script without executing it
        shell: pwsh
        run: |
          $t = $null
          $errors = $null
          foreach ($path in @('native/virtual-driver/DefaultRenderGuard.ps1',
                              'native/virtual-driver/test_DefaultRenderGuard.ps1',
                              'native/virtual-driver/LabEvidenceDirectory.ps1',
                              'native/virtual-driver/LabInputIntegrity.ps1',
                              'native/virtual-driver/LabProcessGuard.ps1',
                              'native/virtual-driver/test_LabProcessGuard.ps1',
                              'native/virtual-driver/test_LabInputIntegrity.ps1',
                              'native/virtual-driver/test_LabEvidenceDirectory.ps1',
                              'native/virtual-driver/run_disposable_lab.ps1',
                              'native/virtual-driver/probe_independent_app_route.ps1',
                              'native/virtual-driver/probe_independent_virtual_pcm.ps1',
                              'native/virtual-driver/IndependentGainCheck.ps1',
                              'native/virtual-driver/test_IndependentGainCheck.ps1',
                              'native/virtual-driver/NoSourceControlCheck.ps1',
                              'native/virtual-driver/test_NoSourceControlCheck.ps1')) {
            $t = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$t, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "Disposable Windows LAB script PowerShell syntax invalid: $path"
            }
          }
          Write-Host 'Lab VM script parses; no driver install or sound hardware access in CI.'


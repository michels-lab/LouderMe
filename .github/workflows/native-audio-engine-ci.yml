name: Michel's Lab native audio DSP CI
on:
  push:
    paths:
      - 'native/audio-engine/**'
      - 'native/windows-bridge/**'
      - '.github/workflows/native-audio-engine-ci.yml'
  pull_request:
    paths:
      - 'native/audio-engine/**'
      - 'native/windows-bridge/**'
      - '.github/workflows/native-audio-engine-ci.yml'

permissions:
  contents: read

jobs:
  dsp:
    name: Native DSP compile and PCM tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure DSP
        run: cmake -S native/audio-engine -B native/audio-engine/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile C++17 DSP
        run: cmake --build native/audio-engine/build --config Release --parallel
      - name: Test gain, EQ, limiter and channel isolation
        run: ctest --test-dir native/audio-engine/build -C Release --output-on-failure

  windows_bridge:
    name: Windows managed/native DSP bridge interop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure native DSP DLL
        run: cmake -S native/audio-engine -B native/audio-engine/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native DSP DLL
        run: cmake --build native/audio-engine/build --config Release --target louderme_audio_c
      - name: Build experimental bridge
        run: dotnet build native/windows-bridge/LouderMeAudioBridge.csproj -c Release
      - name: Validate native C ABI from managed code
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'native/audio-engine/build' -Filter 'louderme_audio_c.dll' -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw 'Native DLL missing.' }
          $outDir = 'native/windows-bridge/bin/Release/net10.0-windows'
          Copy-Item $dll.FullName -Destination "$outDir/louderme_audio_c.dll"
          dotnet "$outDir/LouderMeAudioBridge.dll" --check-native
          if ($LASTEXITCODE -ne 0) { throw 'Native managed bridge DSP test failed.' }
      - name: Validate PCM16/float32 and streaming rate adaptation without audio devices
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-formats
          if ($LASTEXITCODE -ne 0) { throw 'Windows PCM adapter numeric tests failed.' }
      - name: Test PCM16 to native boost to 48k float output pipeline in memory
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-pipeline
          if ($LASTEXITCODE -ne 0) { throw 'Native PCM16 end-to-end pipeline numerical test failed.' }
      - name: Reject false-positive virtual loopback and verify exact 440 Hz tone in memory
        shell: pwsh
        run: |
          dotnet "native/windows-bridge/bin/Release/net10.0-windows/LouderMeAudioBridge.dll" --check-loopback
          if ($LASTEXITCODE -ne 0) { throw 'Virtual loopback signal-identity verification regression failed.' }

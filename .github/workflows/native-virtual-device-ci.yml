name: LouderME Virtual Render Driver Lab CI
on:
  pull_request:
    paths:
      - 'native/virtual-driver/**'
      - '.github/workflows/native-virtual-device-ci.yml'
  push:
    paths:
      - 'native/virtual-driver/**'
      - '.github/workflows/native-virtual-device-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: Derive pinned SysVAD one-output/no-microphone lab source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LouderME
        uses: actions/checkout@v4
        with:
          path: louderme
      - name: Checkout pinned MS-PL SysVAD source
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: 2dc3fd3a0cc84a2933f2194e7ec0871584979071
          path: upstream
          sparse-checkout: |
            audio/sysvad
            LICENSE
      - name: Test derivation guards
        run: python -m unittest discover -s louderme/native/virtual-driver/tests -v
      - name: Produce local virtual-render source and metadata
        run: |
          python louderme/native/virtual-driver/prepare_sysvad.py --upstream-root upstream
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('upstream/audio/sysvad/LOUDERME_LAB_MANIFEST.json')
          info = json.loads(p.read_text())
          assert info['render_endpoints'] == 1
          assert info['capture_endpoints'] == 0
          assert info['recording_to_file_enabled'] is False
          assert info['sample_tone_generator_enabled'] is False
          assert info['hardware_id'] == r'Root\LouderMe_VirtualRender_Lab'
          assert info['driver_signed'] is False
          assert info['real_audio_verified'] is False
          pinf = Path('upstream/audio/sysvad/TabletAudioSample/ComponentizedAudioSample.inx')
          raw_inf = pinf.read_bytes()
          inf = raw_inf.decode('utf-16' if raw_inf.startswith((bytes.fromhex('fffe'), bytes.fromhex('feff'))) else 'utf-8')
          assert 'LouderME Virtual Speaker' in inf
          assert 'TODO-Set-Provider' not in inf
          assert 'LICENSE-MS-PL.txt' in [f.name for f in p.parent.iterdir()]
          print('Pinned Windows virtual device lab source derivation verified.')
          PY
      - name: Validate no signed or installable driver is published
        run: |
          test ! -f upstream/audio/sysvad/TabletAudioSample/tabletaudiosample.sys
          test ! -f upstream/audio/sysvad/TabletAudioSample/tabletaudiosample.inf
          echo 'Source-only prototype: no signed driver/install occurred.'

  driver_build:
    name: Compile derived driver package with WDK NuGet (no install)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: derive
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - name: Checkout LouderME
        uses: actions/checkout@v4
        with:
          path: louderme
      - name: Checkout pinned Microsoft SysVAD with WIL
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: 2dc3fd3a0cc84a2933f2194e7ec0871584979071
          path: upstream
          submodules: recursive
      - name: Restore x64-only Microsoft WDK packages
        shell: pwsh
        run: |
          # Upstream packages.config also restores ARM64 SDK+WDK; those are
          # unnecessary for the Windows x64 lab-driver build.
          [xml]$p = Get-Content upstream/packages.config
          foreach ($pkg in @($p.packages.package)) {
            if ($pkg.id -like '*.arm64') {
              [void]$pkg.ParentNode.RemoveChild($pkg)
            }
          }
          $p.Save((Resolve-Path 'upstream/packages.config').Path)
          nuget restore upstream/packages.config -PackagesDirectory upstream/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'x64 WDK NuGet restore failed.' }
      - name: Transform Microsoft driver source (lab only)
        run: python louderme/native/virtual-driver/prepare_sysvad.py --upstream-root upstream
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Exclude INF stamping on CI without full WDK tools (kernel compile only)
        shell: pwsh
        run: |
          # The hosted VS2026/WDK NuGet runner has kernel headers and linker,
          # but not StampInf.exe. Remove just the MSBuild INF item in this
          # temporary checkout so compilation can prove the real .sys sources.
          # Source INX remains preserved/validated; no installable INF or CAT.
          $proj = 'upstream/audio/sysvad/TabletAudioSample/TabletAudioSample.vcxproj'
          $source = Get-Content $proj -Raw
          $old = '<Inf Exclude="@(Inx)" Include="*.inx" />'
          if (-not $source.Contains($old)) {
            throw 'Unexpected SysVAD INF build item: refuse unsafe project rewrite.'
          }
          $source = $source.Replace($old, '<!-- LouderME lab: driver binary compile only; INF requires full WDK StampInf -->')
          [System.IO.File]::WriteAllText((Resolve-Path $proj).Path, $source, [Text.UTF8Encoding]::new($false))
      - name: Build x64 WaveRT render miniport and kernel SYS (no signed install package)
        shell: pwsh
        run: |
          msbuild upstream/audio/sysvad/EndpointsCommon/EndpointsCommon.vcxproj /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'SysVAD render endpoint library did not compile.' }
          msbuild upstream/audio/sysvad/TabletAudioSample/TabletAudioSample.vcxproj /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'LouderME SysVAD render-only driver failed WDK build.' }
      - name: Verify compiled driver is not claimed signed or installed
        shell: pwsh
        run: |
          $driver = Get-ChildItem upstream/audio/sysvad -Recurse -Filter 'TabletAudioSample.sys' |
            Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if ($null -eq $driver) { throw 'Expected x64 SysVAD driver binary not found.' }
          Write-Host "Compiled lab-only kernel binary: $($driver.FullName)"
          Write-Host 'No INF/CAT or production signing validated. Never install this CI output.'

name: LouderMe VM signed catalog source and trust boundary CI

on:
  pull_request:
    paths:
      - 'native/virtual-driver/SignedLabCatalogGuard.ps1'
      - 'native/virtual-driver/prepare_signed_vm_lab.ps1'
      - 'native/virtual-driver/run_disposable_lab.ps1'
      - 'native/virtual-driver/test_SignedLabCatalogGuard.ps1'
      - '.github/workflows/native-physical-lab-manual.yml'
      - '.github/workflows/native-vm-catalog-trust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify original WDK SHA256 and VM signed-catalog install gate (no driver)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check PowerShell syntax of LAB-only scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'native/virtual-driver/SignedLabCatalogGuard.ps1',
            'native/virtual-driver/prepare_signed_vm_lab.ps1',
            'native/virtual-driver/run_disposable_lab.ps1',
            'native/virtual-driver/test_SignedLabCatalogGuard.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $script : $($errors[0])" }
          }
      - name: Execute adversarial signed package boundary tests without any Windows PnP access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File native/virtual-driver/test_SignedLabCatalogGuard.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'Unsigned original artifact/VM catalog trust boundary tests failed.'
          }
          Write-Host 'PASS: no driver, certificate or Windows audio accessed.'

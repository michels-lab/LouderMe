name: Release LouderMe Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/releases/v*.md'

permissions:
  contents: write

concurrency:
  group: louderme-desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish stable Windows release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'desktop/src/LouderMeDesktop/LouderMeDesktop.csproj'
          $v = [string]$proj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Desktop version could not be resolved.' }
          $notes = "desktop/releases/v$v.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "notes=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate official Windows icon
        shell: pwsh
        run: |
          choco install imagemagick --yes --no-progress
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $exe = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'ImageMagick magick.exe not found.' }
            $magickPath = $exe.FullName
          } else { $magickPath = $magick.Source }
          pwsh -File desktop/installer/prepare-branding.ps1 -MagickPath $magickPath

      - name: Restore, build and validate
        shell: pwsh
        run: |
          dotnet restore desktop/src/LouderMeDesktop/LouderMeDesktop.csproj
          dotnet build desktop/src/LouderMeDesktop/LouderMeDesktop.csproj -c Release --no-restore

          $mainUi=Get-Content 'desktop/src/LouderMeDesktop/MainForm.cs' -Raw
          foreach ($required in @('header.Controls.Add(_aboutAction, 2, 0)','var viewport = new Panel','AutoScroll = true','ViewportWheelFilter','private void OpenAbout()')) {
            if (-not $mainUi.Contains($required)) { throw "Desktop top-About/scroll contract missing: $required" }
          }

          $math=Get-Content 'desktop/src/LouderMeDesktop/BoostMath.cs' -Raw
          if ($math -notmatch '20d \* Math\.Log10') { throw 'Percent-to-dB gain conversion is missing.' }

          $config=Get-Content 'desktop/src/LouderMeDesktop/EqualizerApoConfigBuilder.cs' -Raw
          foreach ($required in @('Device: all','Stage: post-mix','Channel: all','Preamp:','GraphicEQ:','Include: LouderMe.txt')) {
            if ($config -notmatch [regex]::Escape($required)) { throw "APO config contract missing: $required" }
          }

          if ((git hash-object desktop/src/LouderMeDesktop/Assets/MichelDuarte.jpg) -ne '18fe1a68722850c3d8f918dc0799f46ffeb6dbaf') {
            throw 'Desktop Michel Duarte portrait is not canonical.'
          }
          if ((git hash-object desktop/src/LouderMeDesktop/Assets/MichelsLabLockup.png) -ne '7819ef5c7d1a5c338c67c9bbd517e5448724a5cf') {
            throw "Desktop Michel's Lab lockup is not canonical."
          }

          foreach ($file in @(
            'desktop/src/LouderMeDesktop/AboutForm.cs',
            'desktop/src/LouderMeDesktop/SplashForm.cs',
            'desktop/src/LouderMeDesktop/BrandingControls.cs',
            'desktop/src/LouderMeDesktop/DesktopUpdateService.cs'
          )) {
            if (-not (Test-Path $file)) { throw "Required Desktop product surface missing: $file" }
          }

          $about=Get-Content 'desktop/src/LouderMeDesktop/AboutForm.cs' -Raw
          foreach ($required in @('ABOUT THE AUTHOR','Instagram','Facebook','LinkedIn','GitHub','Email','MichelsLabLockup')) {
            if ($about -notmatch [regex]::Escape($required)) { throw "Desktop About contract missing: $required" }
          }

          $updater=Get-Content 'desktop/src/LouderMeDesktop/DesktopUpdateService.cs' -Raw
          if ($updater -notmatch 'louderme-desktop/latest.json') { throw 'Desktop stable update feed is missing.' }

          $brand=Get-Content 'desktop/src/LouderMeDesktop/BrandingControls.cs' -Raw
          $transparentStyleCount=([regex]::Matches($brand, 'SetStyle\(ControlStyles\.SupportsTransparentBackColor, true\)')).Count
          if ($transparentStyleCount -lt 4) { throw 'Transparent custom controls are missing SupportsTransparentBackColor.' }

          $program=Get-Content 'desktop/src/LouderMeDesktop/Program.cs' -Raw
          foreach ($required in @('startup-crash.log','--smoke-test','LouderMe startup error')) {
            if ($program -notmatch [regex]::Escape($required)) { throw "Desktop startup diagnostics contract missing: $required" }
          }

          $iss=Get-Content 'desktop/installer/LouderMe.iss' -Raw
          foreach ($required in @('WizardStyle=modern','[Languages]','spanish.DesktopShortcut','Start LouderMe with Windows')) {
            if ($iss -notmatch [regex]::Escape($required)) { throw "Installer experience contract missing: $required" }
          }
          if ($iss -match 'WizardImageFile=|WizardSmallImageFile=') {
            throw 'LouderMe installer must keep FoamLens-style clean wizard without custom banner images.'
          }

      - name: Publish portable Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/artifacts/publish | Out-Null
          dotnet publish desktop/src/LouderMeDesktop/LouderMeDesktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o desktop/artifacts/publish
          $v='${{ steps.ver.outputs.version }}'
          Copy-Item desktop/artifacts/publish/LouderMe.exe "desktop/artifacts/LouderMe-Portable-v$v.exe"

      - name: Create portable checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="desktop/artifacts/LouderMe-Portable-v$v.exe"
          if (-not (Test-Path $exe)) { throw 'Portable LouderMe EXE was not generated.' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LouderMe-Portable-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $v='${{ steps.ver.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$v" `
            "/DPublishDir=$((Resolve-Path 'desktop/artifacts/publish').Path)" `
            desktop/installer/LouderMe.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

      - name: Create installer checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="desktop/artifacts/LouderMe-Setup-v$v.exe"
          if (-not (Test-Path $exe)) { throw 'Installer EXE was not generated.' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LouderMe-Setup-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Smoke-test real Windows installation
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $setup=(Resolve-Path "desktop/artifacts/LouderMe-Setup-v$v.exe").Path
          $target=Join-Path $env:RUNNER_TEMP 'LouderMeInstallerSmoke'
          $log=Join-Path $env:RUNNER_TEMP 'LouderMeInstallerSmoke.log'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$target","/LOG=$log")
          $process=Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installer smoke test failed with exit code $($process.ExitCode)."
          }
          $installedExe=Join-Path $target 'LouderMe.exe'
          if (-not (Test-Path $installedExe)) {
            if (Test-Path $log) { Get-Content $log }
            throw 'Installer completed but LouderMe.exe was not installed.'
          }

          $app=Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            $crashLog=Join-Path $env:LOCALAPPDATA "Michel's Lab\LouderMe\startup-crash.log"
            if (Test-Path $crashLog) {
              Write-Host '---- LouderMe startup crash log ----'
              Get-Content $crashLog
            }
            throw "Installed LouderMe exited during startup with code $($app.ExitCode)."
          }
          Write-Host "Installed LouderMe stayed alive after startup (PID $($app.Id))."
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          $app.WaitForExit()

          $uninstaller=Join-Path $target 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Installer did not register an uninstaller.' }
          $uninstall=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)." }
          Write-Host 'LouderMe setup installed, launched, stayed alive, and uninstalled successfully.'

      - name: Publish private source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $tag="desktop-v$v"
          $notes='${{ steps.ver.outputs.notes }}'
          $assets=@(
            "desktop/artifacts/LouderMe-Portable-v$v.exe",
            "desktop/artifacts/LouderMe-Portable-v$v.exe.sha256",
            "desktop/artifacts/LouderMe-Setup-v$v.exe",
            "desktop/artifacts/LouderMe-Setup-v$v.exe.sha256"
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "LouderMe Desktop v$v" --notes-file $notes --prerelease=false
          } else {
            gh release create $tag @assets --title "LouderMe Desktop v$v" --notes-file $notes --target "${{ github.sha }}"
          }

      - name: Upload release transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouderMe-Desktop-Release-v${{ steps.ver.outputs.version }}
          path: |
            desktop/artifacts/LouderMe-Portable-v${{ steps.ver.outputs.version }}.exe
            desktop/artifacts/LouderMe-Portable-v${{ steps.ver.outputs.version }}.exe.sha256
            desktop/artifacts/LouderMe-Setup-v${{ steps.ver.outputs.version }}.exe
            desktop/artifacts/LouderMe-Setup-v${{ steps.ver.outputs.version }}.exe.sha256
            desktop/releases/v${{ steps.ver.outputs.version }}.md
